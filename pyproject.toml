[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ngspice-logcheck"
version = "0.2.0"
description = "Offline scalar result checks and comparison reports for ngspice logs and normalized CSV tables."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "hzw0813"}]
dependencies = []
keywords = ["ngspice", "eda", "ci", "measurements", "junit"]

[project.urls]
Repository = "https://github.com/hzw0813/ngspice-logcheck"
Issues = "https://github.com/hzw0813/ngspice-logcheck/issues"

[project.scripts]
ngspice-logcheck = "ngspice_logcheck.cli:main"
simreview = "ngspice_logcheck.table_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
